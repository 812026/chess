<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Chess</title>
  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin: 20px 0 10px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    #board {
      width: 90vw;
      max-width: 480px;
      margin: 15px auto;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }
    button:hover { background: #3a3a3a; }
    #status {
      margin-top: 16px;
      font-size: 16px;
      color: #aaa;
      min-height: 24px;
    }

    /* Grey & white board */
    .white-1e1d7 {
      background-color: #e8e8e8 !important;
    }
    .black-3c85d {
      background-color: #5a5a5a !important;
    }
  </style>
</head>
<body>
  <h1>Chess</h1>
  <div id="board"></div>

  <div class="controls">
    <button id="resetBtn">Reset Game</button>
  </div>
  <div id="status">White to move</div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script>
    const game = new Chess();
    let board = null;
    let computerThinking = false;

    function onDragStart(source, piece) {
      if (game.game_over() || computerThinking) return false;

      // Only let the human move White pieces
      if (piece.search(/^b/) !== -1) return false;
      if (game.turn() !== 'w') return false;
    }

    function onDrop(source, target) {
      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';

      updateStatus();
      window.setTimeout(makeComputerMove, 450);
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    function makeComputerMove() {
      if (game.game_over() || game.turn() !== 'b') return;

      computerThinking = true;
      updateStatus();

      const moves = game.moves({ verbose: true });
      if (moves.length === 0) {
        computerThinking = false;
        return;
      }

      // Prefer captures, then checks, otherwise random
      let candidates = moves.filter(m => m.captured);
      if (candidates.length === 0) {
        candidates = moves.filter(m => m.san.includes('+') || m.san.includes('#'));
      }
      if (candidates.length === 0) {
        candidates = moves;
      }

      const choice = candidates[Math.floor(Math.random() * candidates.length)];
      game.move(choice);
      board.position(game.fen());
      computerThinking = false;
      updateStatus();
    }

    function updateStatus() {
      let status = '';
      const moveColor = game.turn() === 'w' ? 'White' : 'Black';

      if (game.in_checkmate()) {
        status = `Checkmate! ${moveColor === 'White' ? 'Black' : 'White'} wins`;
      } else if (game.in_draw()) {
        status = 'Game drawn';
      } else if (computerThinking) {
        status = 'Black is thinking...';
      } else {
        status = moveColor + ' to move';
        if (game.in_check()) {
          status += ' • Check!';
        }
      }

      document.getElementById('status').textContent = status;
    }

    board = Chessboard('board', {
      draggable: true,
      position: 'start',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      game.reset();
      computerThinking = false;
      board.start();
      updateStatus();
    });

    updateStatus();
  </script>
</body>
</html>
